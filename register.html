<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Ludo Project</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/storage.js"></script>
    <script>skipIfLoggedIn();</script>
  </head>

  <body>
    <h1>THE LUDO GAME</h1>
    <p class="subtitle">Create an account to join the rankings.</p>

    <div class="panel">
      <div class="strip"><span class="g"></span><span class="b"></span><span class="y"></span><span class="r"></span></div>

      <h2>Register</h2>

      <form id="registerForm" novalidate>
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" />

        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" />

        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" />

        <p class="message" id="message" role="alert"></p>

        <button type="submit" class="action">Create account</button>
      </form>

      <p class="switch">Already registered? <a href="login.html">Log in</a></p>
    </div>

    <script src="js/register.js"></script>
  </body>
</html>
